<!doctype html><html lang=en><head><meta charset=utf-8><title>Makers leaderboard – Launchpad</title><script src=scen.js></script>
<style>body{font:14px system-ui;margin:24px;max-width:820px} .row{display:grid;grid-template-columns:50px 1fr 140px 90px 90px 90px;padding:8px;border-bottom:1px solid #eee}</style></head><body>
<h1>Top makers this month</h1><p>The top 1,000 makers by points. Points come from products, comments and forum threads.</p>
<div class=row style="font-weight:600"><span>#</span><span>Maker</span><span>Handle</span><span>Points</span><span>Comments</span><span>Products</span></div>
<div id=list></div><button id=more>Load more</button>
<script>
let seed = 42; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
const first = ['Ana','Ben','Chen','Dara','Eli','Farah','Gus','Hana','Ivo','Jun','Kai','Lena','Milo','Nora','Omar','Pia','Quinn','Rui','Sana','Tom'], last = ['Ito','Ruiz','Novak','Okafor','Berg','Silva','Khan','Lee','Moreau','Costa'];
const makers = []; let pts = 4200;
for (let i = 0; i < 1000; i++) { pts -= Math.floor(rnd() * 14); const f = first[Math.floor(rnd() * 20)], l = last[Math.floor(rnd() * 10)];
  makers.push({ rank: i + 1, name: f + ' ' + l, handle: '@' + (f + l).toLowerCase() + (i + 7), points: Math.max(pts, 3), comments: rnd() < 0.22 ? 0 : 1 + Math.floor(rnd() * 400), products: 1 + Math.floor(rnd() * 9) }); }
const truth = makers.slice(0, 300).filter((m) => m.points > 1000 && m.comments === 0).map((m) => m.handle);
report('truth', truth);
let shown = 0;
const more = () => { const html = makers.slice(shown, shown + 50).map((m) => `<div class=row><span>${m.rank}</span><span>${m.name}</span><span>${m.handle}</span><span>${m.points.toLocaleString('en')}</span><span>${m.comments}</span><span>${m.products}</span></div>`).join('');
  document.getElementById('list').insertAdjacentHTML('beforeend', html); shown += 50; if (shown >= 1000) document.getElementById('more').remove(); report('shown', shown); };
document.getElementById('more').onclick = more; more();
</script></body></html>
